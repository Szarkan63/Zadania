<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Odczyt pliku txt</title>
</head>
<body>

    <h1>Zawartość pliku:</h1>
    <pre id="widok">Ładowanie...</pre>
    <script>
fetch('tekst.txt')
    .then(response => response.text())
    .then(data => {
        document.getElementById('widok').textContent = data;
    });
    </script>

</body>
</html>
